<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Legacy Enterprise</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3949AB" />
    <meta name="description" content="Suite empresarial: CRM, agenda, servicios, pedidos e integraciones." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <!-- Splash: mismo logo que el loader global. AppComponent lo quita al iniciar.
         Colores fijos a propósito (aún no cargó styles.scss). -->
    <div id="app-splash" aria-hidden="true">
      <div class="splash-logo">
        <span class="splash-ring"></span>
        <img src="logo.svg" alt="" width="64" height="64" />
      </div>
      <style>
        #app-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #FBF8FD; --ring: #3949AB; }
        @media (prefers-color-scheme: dark) { #app-splash { background: #131316; } }
        #app-splash .splash-logo { position: relative; width: 112px; height: 112px; display: grid; place-items: center; }
        #app-splash img { width: 64px; height: 64px; object-fit: contain; animation: splash-pulse 1.4s ease-in-out infinite; }
        #app-splash .splash-ring { position: absolute; inset: 0; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--ring) 20%, transparent); border-top-color: var(--ring); animation: splash-spin .9s linear infinite; }
        @keyframes splash-spin { to { transform: rotate(360deg); } }
        @keyframes splash-pulse { 0%, 100% { transform: scale(.92); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
      </style>
      <script>
        // Marca blanca: última marca vista en este dispositivo (la guarda BrandingService).
        try {
          var b = JSON.parse(localStorage.getItem('le_brand') || 'null');
          var s = document.getElementById('app-splash');
          if (b && b.logo) s.querySelector('img').src = b.logo;
          if (b && /^#[0-9a-f]{6}$/i.test(b.primary || '')) s.style.setProperty('--ring', b.primary);
          if (localStorage.getItem('le_theme') === 'dark') s.style.background = '#131316';
        } catch (e) {}
      </script>
    </div>
    <app-root></app-root>
    <noscript>Activa JavaScript para usar Legacy Enterprise.</noscript>
  </body>
</html>
