name: Deploy Production

# Gitflow: push a `pdn` = DESPLEGAR a producción (backend en legacy-vps + frontend en Firebase Hosting).
# Solo se promueve a `pdn` lo que ya pasó por `qa`, y solo con confirmación explícita del dueño.
on:
  push:
    branches: [pdn]
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: deploy-pdn
  cancel-in-progress: false

env:
  APP: legacyenterprise
  ENV_DIR: production
  SHORT: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version stamp
        id: version
        run: |
          HASH=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          sed -i "s/\$version = '[^']*';/\$version = '$HASH';/" backend/app_global_status.php
          sed -i "s/APP_VERSION = '[^']*'/APP_VERSION = '$HASH'/" frontend/src/environments/environment.prod.ts
          grep -q "$HASH" backend/app_global_status.php && grep -q "$HASH" frontend/src/environments/environment.prod.ts

      - name: Lint PHP
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      # El frontend se compila ANTES de tocar el servidor: si el build falla, PDN no queda con backend nuevo
      # y frontend viejo. Node 22 (Angular 22 exige >= 22.22) y el mismo npm que declara package.json:
      # el npm 10 de Node 22 lee distinto el lockfile y `npm ci` fallaba con bindings de rolldown "Missing".
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager || 'npm@latest'")"
          npm ci
          npx ng build --configuration production

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sincronizar backend y migraciones
        run: |
          SSH="ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20"
          DEST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/$APP/$ENV_DIR"
          for i in 1 2 3; do
            rsync -az --delete --exclude='.git' --exclude='.env' --exclude='logs/' --exclude='vendor/' \
              -e "$SSH" ./backend/ "$DEST/app/" \
            && rsync -az --delete -e "$SSH" ./database/migrations/ "$DEST/migrations/" \
            && exit 0
            echo "Intento $i falló, reintentando en 20s..."; sleep 20
          done
          exit 1

      - name: Migraciones y recarga
        run: |
          ssh -i ~/.ssh/id_ed25519 -o ConnectTimeout=20 ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "timeout 300 /opt/vps-tools/migrate.sh $APP $ENV_DIR && timeout 30 docker exec ${APP}_php_${SHORT} service apache2 reload"

      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: legacyenterprise-731cb

      - name: Verificar versión publicada y headers del service worker
        run: |
          V=$(curl -fsS https://api.legacyenterprise.legacysoftware.cloud/app_global_status.php | python3 -c 'import sys,json;print(json.load(sys.stdin)["version"])')
          echo "Backend publicado: $V"
          [ "$V" = "${{ steps.version.outputs.hash }}" ]
          # Sin no-cache los usuarios quedan pegados a una versión vieja (LegacyInSite servía max-age=3600).
          curl -fsSI https://legacyenterprise-731cb.web.app/ngsw-worker.js | grep -qi '^cache-control: no-cache'
