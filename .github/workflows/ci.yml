name: CI

# Validación en integración (dev) y en PRs. No despliega ni usa secretos.
on:
  push:
    branches: [dev]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [dev, qa, pdn]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng lint
      - run: npx ng build --configuration production
