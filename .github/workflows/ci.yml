name: CI

# Gitflow: push a `dev` = INTEGRAR. Valida backend y frontend en cada push a dev y en cada PR.
# No despliega ni usa secretos: los errores aparecen aquí y no en el deploy de QA.
on:
  push:
    branches: [dev]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [dev, qa, pdn]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PHP
        run: find backend -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      # Mismo npm que declara package.json (packageManager): Node 22 trae npm 10 y lee distinto el lockfile.
      - run: npm install -g "$(node -p "require('./package.json').packageManager || 'npm@latest'")"
      - run: npm ci
      - run: npx ng lint
      - run: npx ng build --configuration production
